name: Main - CI

on:
  # Run it on main and release pushes too, in case we merge from a branch that's not up-to-date with the target branch
  # and breaks something after merge (or if we push to main).
  push:
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'src/docs/**/*'
    branches: [ main, release/** ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLAYWRIGHT_TRACING: true

permissions:
  contents: read

jobs:
  build_linux:
    runs-on: ubuntu-24.04
    name: Build (ubuntu-24.04)
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: ./.github/actions/setup-dotnet
    - name: Restore NuGet package cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
    - name: Restore .NET build cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          src/**/bin
          src/**/obj
          test/**/bin
          test/**/obj
        key: dotnet-build-${{ runner.os }}-${{ github.sha }}
    - name: Build
      # See pr_ci.yml for the reason why we disable NuGet audit warnings.
      run: |
        dotnet build -c Release /p:TreatWarningsAsErrors=true /p:RunAnalyzers=true /p:NuGetAudit=false

  unit_tests_linux:
    runs-on: ubuntu-24.04
    name: Unit Tests (ubuntu-24.04)
    needs: build_linux
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: ./.github/actions/setup-dotnet
    - name: Restore NuGet package cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
        fail-on-cache-miss: true
    - name: Restore .NET build cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          src/**/bin
          src/**/obj
          test/**/bin
          test/**/obj
        key: dotnet-build-${{ runner.os }}-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Mark restored build outputs newer than checkout
      shell: bash
      run: |
        find src test \( -path '*/bin/*' -o -path '*/obj/*' \) -type f -print0 | xargs -0 touch
    - name: Unit Tests
      run: |
        dotnet test ./test/OrchardCore.Tests/OrchardCore.Tests.csproj -c Release --no-restore

  functional_tests:
    runs-on: ubuntu-24.04
    name: Functional Tests - ${{ matrix.name }}
    needs: build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CMS
            filter: Cms
          - name: MVC
            filter: Mvc
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: ./.github/actions/setup-dotnet
    - name: Restore NuGet package cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
        fail-on-cache-miss: true
    - name: Restore .NET build cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          src/**/bin
          src/**/obj
          test/**/bin
          test/**/obj
        key: dotnet-build-${{ runner.os }}-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Mark restored build outputs newer than checkout
      shell: bash
      run: |
        find src test \( -path '*/bin/*' -o -path '*/obj/*' \) -type f -print0 | xargs -0 touch
    - name: Cache Playwright Browsers
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('Directory.Packages.props') }}
    - name: Install Playwright Browsers
      run: |
        pwsh test/OrchardCore.Tests.Functional/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    - name: Functional Tests
      run: |
        dotnet test test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-restore --filter-class "*${{ matrix.filter }}*"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: Functional Test failure - ${{ matrix.name }}
        path: |
          src/OrchardCore.Cms.Web/App_Data_Tests_*/logs
          src/OrchardCore.Mvc.Web/App_Data_Tests/logs
          test/OrchardCore.Tests.Functional/traces
        retention-days: 3

  build_test_linux:
    runs-on: ubuntu-24.04
    name: Build & Test (ubuntu-24.04)
    needs: [build_linux, unit_tests_linux, functional_tests]
    if: always()
    steps:
    - name: Check dependent jobs
      shell: bash
      run: |
        test "${{ needs.build_linux.result }}" = "success"
        test "${{ needs.unit_tests_linux.result }}" = "success"
        test "${{ needs.functional_tests.result }}" = "success"
